name: Bootstrap the grammar app source
on:
  push:
    paths:
      - 'bootstrap/source.zip'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand vetted application source and commit
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq bootstrap/source.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          python3 scripts/check_catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install Français Grammaire 500 source [bootstrap complete]'
          git push origin HEAD:main
      - name: Start Android build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh workflow run android.yml --ref main; then exit 0; fi
            sleep 10
          done
          echo 'Could not dispatch Android build' >&2
          exit 1
