name: Build Android APK + offline French female narration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and ffmpeg
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
      - name: Validate grammar and test invariants
        run: python3 scripts/build_annotations.py
          python3 scripts/check_catalog.py
          python3 scripts/test_learning_flow.py
      - name: Compile Android before speech synthesis
        run: gradle --no-daemon :app:assembleDebug
      - name: Reuse unchanged v0.1.0 speech clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev-audio app/src/main/assets/audio
          gh release download v0.1.0 --pattern Grammaire500.apk --dir /tmp/prev-audio
          python3 - <<'PY'
          import zipfile,json
          from pathlib import Path
          changed=set(json.loads(Path('app/src/main/assets/changed_ids.json').read_text())['changed_ids'])
          with zipfile.ZipFile('/tmp/prev-audio/Grammaire500.apk') as apk:
              for i in range(1,501):
                  if i in changed:continue
                  audio=apk.read(f'assets/audio/{i:04d}.ogg')
                  assert len(audio)>1800
                  Path(f'app/src/main/assets/audio/{i:04d}.ogg').write_bytes(audio)
          print('Reused',500-len(changed),'original voice files')
          PY
      - name: Generate 500 French female recordings
        run: |
          pip install -r scripts/requirements-audio.txt
          python3 scripts/generate_audio.py
      - name: Validate all offline audio files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/audio')
          files=list(p.glob('*.ogg'))
          assert len(files)==500, len(files)
          assert all(f.stat().st_size>=1800 for f in files)
          PY
      - name: Assemble final offline APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Grammaire500-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Grammaire500.apk
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'v0.3.0 already exists; not overwriting existing release.'
          else
            gh release create v0.3.0 Grammaire500.apk --target "$GITHUB_SHA" --title 'Français Grammaire 500 — preview v0.3.0' --notes 'Concise explanations, unverified IPA, word ordering, instant feedback and locally stored progress.'
          fi
