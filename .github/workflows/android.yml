name: Build Android APK + offline French female narration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and ffmpeg
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
      - name: Validate grammar and test invariants
        run: python3 scripts/build_annotations.py
          python3 scripts/check_catalog.py
          python3 scripts/test_learning_flow.py
      - name: Compile Android before speech synthesis
        run: gradle --no-daemon :app:assembleDebug
      - name: Reuse verified offline voice clips unchanged from v0.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prev-audio app/src/main/assets/audio
          gh release download v0.3.1 --pattern Grammaire500.apk --dir /tmp/prev-audio
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          current=Path('app/src/main/assets/examples.json').read_bytes()
          assert hashlib.sha256(current).hexdigest()=='42f52d078124792d799ec28d5ed85abca6384e19a876990a87023df18285a05e', 'Speech source text changed; audio regeneration is required'
          with zipfile.ZipFile('/tmp/prev-audio/Grammaire500.apk') as apk:
              embedded=apk.read('assets/examples.json')
              assert embedded==current, 'Word/voice alignment mismatch; regenerate audio'
              for i in range(1,501):
                  clip=apk.read(f'assets/audio/{i:04d}.ogg')
                  assert len(clip)>=1800
                  Path(f'app/src/main/assets/audio/{i:04d}.ogg').write_bytes(clip)
              Path('app/src/main/assets/audio/manifest.json').write_bytes(apk.read('assets/audio/manifest.json'))
          print('Verified and restored 500 unchanged recordings')
          PY
      - name: Validate all offline audio files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/audio')
          files=list(p.glob('*.ogg'))
          assert len(files)==500, len(files)
          assert all(f.stat().st_size>=1800 for f in files)
          PY
      - name: Assemble final offline APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Grammaire500-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Grammaire500.apk
          if gh release view v0.3.1 >/dev/null 2>&1; then
            echo 'v0.3.1 already exists; not overwriting existing release.'
          else
            gh release create v0.3.1 Grammaire500.apk --target "$GITHUB_SHA" --title 'Français Grammaire 500 — preview v0.3.1' --notes 'Concise explanations, unverified IPA, word ordering, instant feedback and locally stored progress.'
          fi
