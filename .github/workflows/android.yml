name: Build Android APK + offline French female narration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and ffmpeg
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Validate grammar and test invariants
        run: python3 scripts/check_catalog.py
      - name: Compile Android before speech synthesis
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate 500 French female recordings
        run: |
          pip install -r scripts/requirements-audio.txt
          python3 scripts/generate_audio.py
      - name: Validate all offline audio files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/audio')
          files=list(p.glob('*.ogg'))
          assert len(files)==500, len(files)
          assert all(f.stat().st_size>=1800 for f in files)
          PY
      - name: Assemble final offline APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Grammaire500-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Grammaire500.apk
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; not overwriting existing release.'
          else
            gh release create v0.1.0 Grammaire500.apk --target "$GITHUB_SHA" --title 'Français Grammaire 500 — preview v0.1.0' --notes '50 grammar sections, 500 bilingual example sentences, section quizzes, offline French female audio. Preview: full language/audio human proofreading not yet completed.'
          fi
