name: Build Android APK — 59 intensive textbook units
on:
  push:
    branches: [main]
    paths-ignore:
      - 'netlify.toml'
      - 'scripts/deploy_netlify_release.py'
      - 'web/app.js'
      - 'web/sw.js'
      - 'scripts/test_audio_sw.js'
      - '.github/workflows/netlify.yml'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK and French IPA engine
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng
      - name: Validate learning material and all tests
        run: |
          set -euo pipefail
          python3 scripts/build_course_ipa.py
          python3 scripts/build_intensive.py
          python3 scripts/enrich_intensive.py
          python3 scripts/test_voice_coverage.py
          python3 scripts/test_intensive.py
          python3 scripts/check_catalog.py
          python3 scripts/test_learning_flow.py
          python3 scripts/check_quiz_ranges_v040.py
          python3 scripts/check_course.py
          node --check web/app.js
      - name: Compile app before TTS synthesis
        run: gradle --no-daemon :app:assembleDebug
      - name: Reuse all 559 matching offline recordings from v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/voice-v050 app/src/main/assets/audio
          gh release download v0.5.0 --repo '${{ github.repository }}' --pattern Grammaire500.apk --dir /tmp/voice-v050
          python3 - <<'PYVOICE'
          import zipfile
          from pathlib import Path
          root=Path('app/src/main/assets')
          with zipfile.ZipFile('/tmp/voice-v050/Grammaire500.apk') as apk:
              for name in ('examples.json','course.json'):
                  assert apk.read('assets/'+name)==(root/name).read_bytes(), f'Speech source content changed: {name}'
              audios=[n for n in apk.namelist() if n.startswith('assets/audio/') and n.endswith('.ogg')]
              assert len(audios)==559, len(audios)
              for name in audios:
                  target=root/'audio'/Path(name).name
                  target.write_bytes(apk.read(name))
              for name in ('manifest.json','course_manifest.json'):
                  (root/'audio'/name).write_bytes(apk.read('assets/audio/'+name))
          print('Reused 559 full-quality original voice masters. Runtime pitch-preserving rate defaults to 0.8x.')
          PYVOICE
      - name: Generate 114 missing female French example recordings
        run: |
          set -euo pipefail
          pip install -r scripts/requirements-audio.txt
          python3 scripts/generate_extra_audio.py
      - name: Validate technical audio quality of every recording
        run: |
          set -euo pipefail
          pip install 'numpy>=1.26,<3' 'soundfile>=0.12,<1'
          python3 scripts/check_audio_quality.py --report docs/AUDIO_QA_v061.json
      - name: Verify 673 audio clips and IPA mapping
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          f=Path('app/src/main/assets/audio')
          assert len(list(f.glob('[0-9][0-9][0-9][0-9].ogg')))==500
          assert len(list(f.glob('course_*.ogg')))==59
          assert len(list(f.glob('extra_*.ogg')))==114
          assert len(list(f.glob('*.ogg')))==673
          assert all(p.stat().st_size>1800 for p in f.glob('*.ogg'))
          marks=json.loads(Path('app/src/main/assets/course_ipa.json').read_text(encoding='utf8'))
          assert [x['id'] for x in marks]==list(range(1,60))
          print('673 voice files checked')
          PY
      - name: Build final APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Bundle 673 audio files for Netlify
        run: |
          set -euo pipefail
          python3 scripts/build_web.py --apk app/build/outputs/apk/debug/app-debug.apk
          (cd dist && zip -qr ../Netlify-site.zip .)
          test -s Netlify-site.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrancaisGrammaire-v0.6.1
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FrancaisGrammaire-Netlify-site-v0.6.1
          path: Netlify-site.zip
      - name: Publish immutable preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.6.1 >/dev/null 2>&1; then
            echo 'ERROR: v0.6.1 already exists. Bump version instead of replacing a published APK.' >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Grammaire500.apk
          gh release create v0.6.1 Grammaire500.apk Netlify-site.zip docs/AUDIO_QA_v061.json --target "$GITHUB_SHA" --title 'Français Grammaire v0.6.1 — 詳細講義と1180問' --notes 'Added 114 new female sentence recordings. All 413 example slots and 1180 answers have sentence IPA and audio links. Android and Web have streamlined lecture/example/test flow. Pronunciation not certified by French native-speaker review.'
