# Netlify web voice fix v0.6.2: 206 byte-range, offline replay, new SW cache.
# Bundled v0.6.1 audio (673 clips), web app.js/sw.js patched from GitHub main.
[build]
  command = "python3 scripts/deploy_netlify_release.py --release v0.6.1"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
